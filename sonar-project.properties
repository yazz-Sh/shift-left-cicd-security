# Analyse SonarCloud (job 3 du workflow). Organisation et cle : voir README.
sonar.organization=yazz-sh
sonar.projectKey=yazz-Sh_shift-left-cicd-security
sonar.projectName=shift-left-cicd-security
sonar.sources=app/facturation,app/Dockerfile
sonar.tests=app/tests
sonar.python.version=3.12
# La couverture (>= 80 %) est verifiee par le job unit_tests, qui s'execute APRES SonarCloud
sonar.coverage.exclusions=**/*
# Centralisation : les resultats Semgrep (SAST) sont importes dans SonarCloud
sonar.sarifReportPaths=reports/semgrep.sarif
# Le job echoue si le quality gate SonarCloud n'est pas "Passed"
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
